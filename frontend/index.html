<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f5f4" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Comunica incidencias urbanas, sigue su estado en el mapa y ayuda a mejorar Málaga." />
    <title>UrbanPulse · Incidencias urbanas en Málaga</title>
    <script>
      // Aplica el tema antes del primer pintado para evitar un parpadeo claro/oscuro
      (function () {
        try {
          var stored = localStorage.getItem("urbanpulse-theme");
          var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#0a1214" : "#f2f5f4");
        } catch (e) { document.documentElement.dataset.theme = "light"; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
