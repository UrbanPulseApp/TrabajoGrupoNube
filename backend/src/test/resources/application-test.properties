# Test profile: isolates the @SpringBootTest suite from the local development data. See ADR-14.
# Tests reuse the same PostgreSQL server (Docker locally, service container in CI) but write into
# their own schema, so the "public" schema read by the running application is never touched.
# DATABASE_URL is deliberately ignored here: tests must never point at a shared or remote database.
spring.datasource.url=jdbc:postgresql://localhost:5432/urbanpulse?currentSchema=urbanpulse_test
spring.jpa.properties.hibernate.default_schema=urbanpulse_test

# Creates the schema before Hibernate builds the tables (script initialisation runs before JPA by default).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/test-schema.sql

spring.jpa.show-sql=false
