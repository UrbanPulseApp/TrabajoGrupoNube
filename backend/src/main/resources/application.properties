spring.application.name=urbanpulse-backend

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/urbanpulse}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Puerto del backend
server.port=${PORT:8080}

# Evidencias: directorio persistente configurable fuera del código fuente.
urbanpulse.attachments.directory=${ATTACHMENTS_DIRECTORY:uploads/attachments}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Sesiones web: HttpOnly evita que JavaScript lea la cookie de sesión.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Crea un administrador inicial solo cuando se proporcionan ambos secretos.
urbanpulse.bootstrap.admin-email=${URBANPULSE_ADMIN_EMAIL:}
urbanpulse.bootstrap.admin-password=${URBANPULSE_ADMIN_PASSWORD:}
